[package]
name = "log-lens"
description = "A simple Leptos application. Analyze the logs efficiently on Client-side with power of WASM"
authors = ["BSŞ"]
version = "0.1.0"
edition = "2024"

[dependencies]
console_error_panic_hook = "0.1.7"
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = [
    "File",
    "FileList",
    "HtmlInputElement",
    "DragEvent",
    "DataTransfer",
    "Performance",
] }
